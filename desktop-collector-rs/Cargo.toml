[package]
name = "lol-collector"
version = "2.0.0"
edition = "2021"
build = "build.rs"

[lib]
name = "lol_collector"
path = "src/lib.rs"

[[bin]]
name = "LoL-Collector"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "rustls", "webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"
chrono = "0.4"
winreg = "0.56"
tray-icon = "0.24"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
