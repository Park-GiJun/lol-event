server:
  port: 8081

spring:
  application:
    name: main-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: lol_event
        format_sql: true
        show_sql: false
    open-in-view: false
  flyway:
    schemas:
      - lol_event
    default-schema: lol_event

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, loggers, env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

riot:
  api:
    key: ${RIOT_API_KEY:RGAPI-f03ce321-61e7-4ea3-96c9-4d8892b85949}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    enabled: false   # UI는 SwaggerUiController에서 직접 서빙
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  cors:
    # 게이트웨이가 쓰던 목록 그대로. 배포 도메인이 바뀌면 APP_CORS_ALLOWED_ORIGINS 로 덮는다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000,http://localhost:4173,https://lol.gijun.net}

# AI(RAG · 챗봇 · 팀 짜기). LLM 은 집 안 장비(BC-250)의 llama.cpp 서버 둘이다.
# 그 장비가 꺼져 있으면 AI 기능만 실패하고 통계 사이트는 그대로 돈다. 항목 설명은 RagProperties 에 있다.
rag:
  chat:
    base-url: ${RAG_CHAT_BASE_URL:http://172.30.1.54:8080}
    model: ${RAG_CHAT_MODEL:qwen}
    api-key: ${RAG_CHAT_API_KEY:none}
  embedding:
    base-url: ${RAG_EMBEDDING_BASE_URL:http://172.30.1.54:8081}
    model: ${RAG_EMBEDDING_MODEL:pqnet/bge-m3-gguf:F16}
    api-key: ${RAG_EMBEDDING_API_KEY:none}
    dimensions: 1024
