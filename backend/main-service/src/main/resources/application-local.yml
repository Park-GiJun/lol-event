# 로컬 개발 프로파일.
#
# Config Server 임포트와 Eureka 등록 설정은 걷어냈다. 두 서비스를 없앴고
# spring-cloud 클라이언트 의존성도 빠져서, 남겨 두면 `configserver:` 접두사를
# 풀어 줄 리졸버가 없어 기동이 막힌다.
spring:
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9093}
    consumer:
      group-id: main-service-match-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  batch:
    job:
      enabled: false   # 서버 시작 시 자동 실행 방지
    jdbc:
      initialize-schema: always
      table-prefix: lol_event.BATCH_

scheduling:
  enabled: true
