# 프론트엔드 정적 서빙 + API 리버스 프록시.
#
# 예전 구성은 컨테이너가 다섯 개였다.
#   lol-frontend(node + `npm install -g serve`) / lol-api-gateway / lol-eureka
#   / lol-main-service / lol-lcu-service
#
# 이 중 셋을 걷어냈다.
#   - lol-lcu-service : 윈도우의 롤 lockfile(C:/Riot Games/...)을 읽는 코드인데 리눅스
#                       컨테이너로 떠 있었다. /api/lcu/status 가 늘 "lockfile 없음"만 뱉었고,
#                       유일한 고유 엔드포인트인 POST /api/lcu/ingest 는 호출자가 아무도 없다.
#                       전적 수집은 데스크탑 수집기가 /api/matches/bulk 로 직접 보낸다.
#   - lol-eureka      : 등록 대상이 main-service 하나뿐인 디스커버리 + Config Server.
#   - lol-api-gateway : 하는 일이 라우팅 다섯 개와 CORS 뿐이었다(JWT 필터는 통과만 하는 빈 껍데기).
#                       CORS 는 main-service 로 옮겼고 라우팅은 이 파일이 대신한다.
#
# 남는 건 nginx 와 main-service 둘이다.

upstream main_service {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /app;
    index index.html;

    # 업로드는 전적 벌크 전송이 가장 크다. 기본 1MB 로는 막힌다.
    client_max_body_size 32m;

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://main_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 통계 집계가 매치를 통째로 메모리에 올려 도는 구간이 있어 기본 60초로는 짧다.
        proxy_read_timeout 120s;
    }

    # Swagger UI 와 OpenAPI 스펙은 /api/** 밖의 경로로 서빙된다.
    location ~ ^/(swagger-ui|api-docs) {
        proxy_pass http://main_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 정적 파일 ──────────────────────────────────────────────────────────
    # 빌드 산출물은 파일명에 해시가 붙어 내용이 바뀌면 이름도 바뀐다. 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 나머지는 전부 SPA 진입점으로 떨어뜨린다. `serve -s` 와 같은 동작이다.
    # 이게 없으면 /players/xxx 를 새로고침했을 때 404 가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
